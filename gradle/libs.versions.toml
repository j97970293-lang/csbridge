[versions]
agp = "8.13.2"
kotlin = "2.4.0"
serialization = "1.11.0"
coroutines = "1.10.2"
okhttp = "5.4.0"
jsoup = "1.22.2"
desugar = "2.1.5"
preferencektx = "1.2.1"
appcompat = "1.7.1"

# --- Cloudstream runtime: keep in sync with the CS release you target ---
csJackson = "2.13.1"      # 2.13.2+ breaks Android < 26
csRhino = "1.8.1"         # 1.9.0+ requires minSdk 26
csKsoup = "0.2.6"
csKtor = "3.5.0"
csDatetime = "0.8.0"
csIoCore = "0.9.1"
csAtomicfu = "0.33.0"
csCryptography = "0.6.0"
csNiceHttp = "0.4.18"
csGson = "2.11.0"

[libraries]
# Provided by the host app at runtime (NOT bundled into the APK)
aniyomi-extensions-lib = { module = "com.github.aniyomiorg:extensions-lib", version = "v17" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferencektx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# Bundled: the Cloudstream runtime (version comes from gradle.properties ->
# CS_LIBRARY_VERSION) and its dependencies.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "csJackson" }
rhino = { module = "org.mozilla:rhino", version.ref = "csRhino" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup-android", version.ref = "csKsoup" }
ktor-http = { module = "io.ktor:ktor-http", version.ref = "csKtor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "csDatetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "csIoCore" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "csAtomicfu" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "csCryptography" }
cryptography-provider = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "csCryptography" }
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "csNiceHttp" }
# Used by the built-in Dailymotion / GDMirrorbot / Voe extractors
gson = { module = "com.google.code.gson:gson", version.ref = "csGson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
