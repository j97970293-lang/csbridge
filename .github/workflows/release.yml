name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A tag push checks out a detached HEAD: force main so the auto-commit
      # step (which pushes the rebuilt APK) has a branch to push.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the APK (no Android SDK needed)
        run: bash tools/build-manual.sh
        env:
          CACHE: ${{ github.workspace }}/tools/.cache
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Controls
        run: |
          bash tools/check-compat.sh
          python3 tools/check-dex.py apk/csbridge.apk || true

      - name: Publish the APK in the repo folder (so the raw URL works at once)
        run: |
          mkdir -p repo/apk
          cp apk/csbridge.apk repo/apk/csbridge.apk

      - name: Commit the APK + index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update csbridge.apk and repo index"
          file_pattern: repo/*

      - name: Update the repository index
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          m = open('app/src/main/AndroidManifest.xml').read()
          print(re.search(r'versionName="([^"]+)"', m).group(1))
          PY
          )
          SHA=$(keytool -list -v \
                  -keystore tools/bridge.keystore -storetype PKCS12 -storepass csbridge \
                | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          python3 - "$VERSION" "$SHA" <<'PY'
          import json, sys
          version, sha = sys.argv[1], sys.argv[2]
          idx = json.load(open('repo/index.min.json'))
          for e in idx:
              e['version'] = version
              e['apk'] = 'csbridge.apk'
          json.dump(idx, open('repo/index.min.json', 'w'), indent=2)
          open('repo/signing.txt', 'w').write(sha + "\n")
          print('index:', idx[0]['version'], 'fingerprint:', sha)
          PY

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/csbridge.apk
            repo/index.min.json
          generate_release_notes: true
