# JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin / Gradle
org.jetbrains.kotlin.gradle.incremental=true

# IMPORTANT: the host app (Aniyomi) provides kotlin-stdlib at runtime.
# The extension is loaded with a CHILD-FIRST classloader, so if we bundled our own
# copy of kotlin-stdlib / okhttp / jsoup / coroutines, the app and this extension
# would end up with two different Class objects for the same type
# (ClassCastException / LinkageError when handing SAnime, Video, Headers... to the app).
kotlin.stdlib.default.dependency=false

# ---------------------------------------------------------------------------
# Cloudstream runtime (the `library` module of recloudstream/cloudstream).
#
# This is the SAME artifact Cloudstream plugins are compiled against, which is
# what makes it possible to run them here: MainAPI, ExtractorApi, the 90+
# built-in extractors, NiceHttp (`app.get`), Rhino (JS), Jackson +
# kotlinx.serialization, HLS/M3U8 parsing, subtitle helpers...
#
# Bump this together with the Cloudstream version the plugins you install were
# built for. `master-SNAPSHOT` = bleeding edge (needs a JitPack build on first
# use, can take several minutes).
# ---------------------------------------------------------------------------
CS_LIBRARY_VERSION=v4.8.0

# Set to true to bundle kotlinx-coroutines in the APK instead of using the
# host app's copy. Only useful if you hit a NoSuchMethodError coming from
# kotlinx.coroutines.
CS_BUNDLE_COROUTINES=false

# Set to true to bundle okhttp/jsoup in the APK. NOT recommended: Video.headers
# and other types are shared with the host app.
CS_BUNDLE_OKHTTP=false
